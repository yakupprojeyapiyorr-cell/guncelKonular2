services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: focusflow-db
    environment:
      POSTGRES_DB: focusflow
      POSTGRES_USER: focusflow
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-focusflow123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - focusflow-network

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: focusflow-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://db:5432/focusflow
      DATABASE_USERNAME: focusflow
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-focusflow123}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      UPLOAD_DIR: /app/uploads
      ALLOWED_ORIGINS: "*"
      APP_CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - focusflow-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: focusflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - focusflow-network
    restart: unless-stopped

volumes:
  pgdata:
  uploads:

networks:
  focusflow-network:
    driver: bridge
